[project]
name = "time-to-default"
version = "0.1.0"
description = "Análise de sobrevivência do tempo até a inadimplência (LendingClub): Kaplan-Meier, Cox e riscos competitivos"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "kagglehub>=1.0.2",
    "lifelines>=0.30.3",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "numpy>=2.5.3",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/time_to_default"]

[tool.pytest.ini_options]
testpaths = ["tests"]
